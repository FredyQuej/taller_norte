services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_mantenimiento}
      POSTGRES_USER: ${POSTGRES_USER:-mantenimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-control_mantenimiento}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      postgres:
        condition: service_healthy

  vehicle-service:
    build: ./services/vehicle-service
    restart: unless-stopped
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-control_mantenimiento}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    depends_on:
      postgres:
        condition: service_healthy

  service-service:
    build: ./services/service-service
    restart: unless-stopped
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-control_mantenimiento}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
    depends_on:
      postgres:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-control_mantenimiento}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      SERVICE_REMINDERS_ENABLED: ${SERVICE_REMINDERS_ENABLED:-true}
      SERVICE_REMINDERS_CRON: ${SERVICE_REMINDERS_CRON:-0 9 * * *}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
    depends_on:
      postgres:
        condition: service_healthy

  assistant-service:
    build: ./services/assistant-service
    restart: unless-stopped
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-mantenimiento}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@postgres:5432/${POSTGRES_DB:-control_mantenimiento}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-3.5-flash,gemini-3.1-flash-lite}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - auth-service
      - vehicle-service
      - service-service
      - order-service
      - assistant-service

volumes:
  postgres_data: